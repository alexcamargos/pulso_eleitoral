[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulso-eleitoral"
version = "0.1.0"
description = "Plataforma ETL, analítica colunar e SPA estática para auditoria determinística de logs de urnas e Boletins de Urna do TSE."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asn1tools>=0.167.0",
    "duckdb>=1.1.0",
    "httpx[http2]>=0.28.0",
    "orjson>=3.10.0",
    "polars>=1.18.0",
    "py7zr>=0.22.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "winloop>=0.1.8; sys_platform == 'win32'",
]

[project.scripts]
pulso = "pulso_eleitoral.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.122.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pulso_eleitoral"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B", "SIM", "PT", "TID251", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pulso_eleitoral", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest".msg = "Proibido usar unittest; utilize exclusivamente pytest e pytest-mock."
"unittest.mock".msg = "Proibido usar unittest.mock; utilize exclusivamente a fixture mocker do pytest-mock."

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asn1tools.*", "py7zr.*", "winloop.*", "uvloop.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live_tse: executa smoke tests reais contra servidores publicos do TSE (desabilitado por padrao offline)",
]

[tool.coverage.run]
source = ["pulso_eleitoral"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
